[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rush-hour-forecast"
version = "0.1.0"
description = "Forecast tomorrow's hourly bike rentals using only tonight's information"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[project.scripts]
rush-hour = "rush_hour.cli:main"

[tool.setuptools.packages.find]
include = ["rush_hour*"]
